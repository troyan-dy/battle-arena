[flake8]
# wemake-python-styleguide for the asset tools (tools/); the game in live/ is JS
select = WPS
max-line-length = 132
# numpy pixel maths: one array expression per line routinely scores 15–20; the default 14 would mean a temporary per operator
max-line-complexity = 20
exclude = .git,__pycache__,.venv,art,docs,live,study,frames,dist
per-file-ignores =
    # command-line scripts: print is their output
    tools/batcut.py: WPS421
    tools/derive_brute.py: WPS421
    tools/finish.py: WPS421
    tools/hero_split.py: WPS421
    tools/rigclean.py: WPS421
    tools/show_rig.py: WPS421
